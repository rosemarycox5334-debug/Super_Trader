# Host-managed Python backend; Client registers a native right-sidebar page.
- insert:
    - id: super-trader
      name: dsh-super-trader
    - id: dsh-soul
      name: dsh-soul
      inject: [tools, systemPrompt, commands]
      config:
        memory:
          enabled: true
          maxNodes: 5000
          projectionBytes: 600
        evolution:
          enabled: false
    - id: mcp-connector
      name: dsh-mcp-connector
      config:
        catalogUrl: 'https://cdn.jsdelivr.net/gh/duhu2000/dsh-mcp-connector-registry@main/catalog.json'
        persistSecrets: true
        entryPrefix: mcp
        refreshSkewMs: 300000
        openBrowser: true
        showSidebarEntry: false
        compactManagementTools: false
        frameAncestors: [self]
