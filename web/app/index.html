<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Super Agent · 投研工作台</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#workspace">跳到主区</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="工作台导航">
      <a class="brand" href="#chat">
        <span class="brand-mark">S</span>
        <span class="brand-text">SUPER TRADER<small>万物皆插件</small></span>
      </a>
      <nav id="main-nav" class="plugin-nav" aria-label="插件导航"></nav>
      <div class="sidebar-bottom">
        <button class="manage-btn" data-action="plugin-manager">管理工作台插件</button>
        <div class="env-card" id="env-card">
          <span class="env-dot" id="env-dot"></span>
          <span class="env-text" id="env-text">环境检查中…</span>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main-shell">
      <header class="topbar">
        <button class="icon-btn mobile-menu" aria-label="打开导航" data-action="toggle-nav">☰</button>
        <div class="breadcrumb">工作台 <span>/</span> <strong id="page-title">Super Agent</strong></div>
        <div class="topbar-right">
          <span class="snapshot">历史快照 <b id="snapshot-date">—</b></span>
        </div>
      </header>
      <main class="workspace" id="workspace" tabindex="-1" aria-live="polite"></main>
      <footer class="statusbar">
        <span id="status-left">就绪</span>
        <span class="disclaimer">内样本历史频率 · 非投资建议 · 不接实盘</span>
      </footer>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="modal"></dialog>
  <script src="/assets/app.js"></script>
</body>
</html>
